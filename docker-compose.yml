version: '3.5'

services:
  mysql:
    image: mysql:8.0
    container_name: mysqldev
    volumes:
      - db_mysql:/var/lib/mysql:rw
    restart: always
    expose:
      - 3306
    ports:
      - 3306:3306
    networks:
        - sajadweb
    env_file:
    - docker.env
  # phpmyadmin
  phpmyadmin:
    container_name: phpmyadmin
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - '60:80'
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 1234
    networks:
      - sajadweb
networks:
  sajadweb:
    external: true

volumes:
  db_mysql: {}