version: "3.5"

services:
  #Redis Service
  redis:
    image: "redis:alpine"
    ports:
      - "127.0.0.1:6379:6379"
    tty: true
    container_name: redis
    restart: always
    environment:
      - REDIS_REPLICATION_MODE=master
    volumes:
      - db_redis:/data:rw
    # command: "redis-server --requirepass 11336688"
    networks:
      - sajadweb
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0
      # - REDIS_HOSTS=local:redis:6379:0:11336688
    ports:
      - "127.0.0.1:6380:8081"
    depends_on:
        - redis
    networks:
      - sajadweb
networks:
  sajadweb:
    external: true

volumes:
  db_redis: {}
